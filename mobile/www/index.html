<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HFee AI</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; color: #1f1d1b; background: #fff; text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px; background: #d87858; color: #fff; display: grid; place-items: center; font-weight: 800; }
      p { margin: 4px 24px; color: #6b655e; }
      button { margin-top: 20px; height: 44px; padding: 0 22px; border: none; border-radius: 12px; background: #d87858; color: #fff; font: inherit; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #1a1918; color: #eceae6; } p { color: #a39d95; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">HF.</div>
      <strong>Can't reach HFee AI</strong>
      <p>Check your internet connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
